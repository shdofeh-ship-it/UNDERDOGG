<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- HUD Circular rings background -->
  <circle cx="50" cy="50" r="45" stroke="#ff0022" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="4, 4"/>
  <circle cx="50" cy="50" r="38" stroke="#ff0022" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="50" cy="50" r="32" stroke="#ff0022" stroke-width="1" fill="none" opacity="0.4" stroke-dasharray="10, 5"/>
  <!-- Play symbol -->
  <polygon points="40,30 70,50 40,70" fill="none" stroke="#ff1a3c" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
</svg>