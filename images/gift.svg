<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- HUD Circular rings background -->
  <circle cx="50" cy="50" r="45" stroke="#ff0022" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="4, 4"/>
  <circle cx="50" cy="50" r="38" stroke="#ff0022" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="50" cy="50" r="32" stroke="#ff0022" stroke-width="1" fill="none" opacity="0.4" stroke-dasharray="10, 5"/>
  <!-- Gift Box -->
  <rect x="28" y="46" width="44" height="30" fill="none" stroke="#ff1a3c" stroke-width="3" rx="2" filter="url(#glow)"/>
  <rect x="25" y="38" width="50" height="8" fill="none" stroke="#ff1a3c" stroke-width="3" rx="2" filter="url(#glow)"/>
  <line x1="50" y1="38" x2="50" y2="76" stroke="#ff1a3c" stroke-width="3" filter="url(#glow)"/>
  <!-- Bow -->
  <path d="M 50,38 C 40,25 25,35 45,38 Z" fill="none" stroke="#ff1a3c" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 50,38 C 60,25 75,35 55,38 Z" fill="none" stroke="#ff1a3c" stroke-width="2.5" filter="url(#glow)"/>
</svg>