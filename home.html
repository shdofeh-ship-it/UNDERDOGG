<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>Управление профилем — UNDERDOGG</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">

    <header class="header">
        <div class="logo">UNDERDOGG HUB</div>
        <button class="menu-btn" id="openNavBtn" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <main class="home-container">
        <section class="profile-card">
            <h2>Управление аккаунтом</h2>
            <p class="subtitle">Ваши привязанные социальные сети и аккаунты</p>

            <form id="userDataForm" class="user-data-form">
                <div class="input-group">
                    <label for="telegramField">Telegram Username / ID</label>
                    <input type="text" id="telegramField" readonly placeholder="Загрузка...">
                </div>

                <div class="input-group">
                    <label for="kickField">Никнейм Kick</label>
                    <input type="text" id="kickField" readonly placeholder="Загрузка...">
                </div>

                <div class="input-group">
                    <label for="epicField">Никнейм Epicstar</label>
                    <input type="text" id="epicField" readonly placeholder="Загрузка...">
                </div>

                <div class="actions">
                    <button type="button" id="editBtn" class="action-btn edit">Изменить данные</button>
                    <button type="button" id="saveBtn" class="action-btn save hidden">Сохранить</button>
                    <button type="button" id="cancelBtn" class="action-btn cancel hidden">Отмена</button>
                </div>
            </form>
        </section>
    </main>

    <div class="nav-overlay" id="navOverlay"></div>
    <nav class="nav-menu" id="navMenu">
        <div class="nav-header">
            <h3>МЕНЮ</h3>
            <button class="close-btn" id="closeNavBtn">&times;</button>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Главная</a></li>
            <li><a href="home.html" class="active">Мой профиль</a></li>
        </ul>
    </nav>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
            }

            // Навигация (Бургер)
            const openBtn = document.getElementById("openNavBtn");
            const closeBtn = document.getElementById("closeNavBtn");
            const navMenu = document.getElementById("navMenu");
            const navOverlay = document.getElementById("navOverlay");

            function openMenu() {
                if (navMenu) navMenu.classList.add("active");
                if (navOverlay) navOverlay.classList.add("active");
            }

            function closeMenu() {
                if (navMenu) navMenu.classList.remove("active");
                if (navOverlay) navOverlay.classList.remove("active");
            }

            if (openBtn) openBtn.addEventListener("click", openMenu);
            if (closeBtn) closeBtn.addEventListener("click", closeMenu);
            if (navOverlay) navOverlay.addEventListener("click", closeMenu);

            // Функция статуса стрима (если вызывается на странице)
            function updateStreamStatus() {
                const statusDot = document.getElementById("statusDot");
                const statusLabel = document.getElementById("statusLabel");
                const signalIcon = document.getElementById("signalIcon");
                const streamBadge = document.getElementById("streamBadge");
                const giveawayBadge = document.getElementById("giveawayBadge");

                const streamStatus = localStorage.getItem("streamStatus");
                const streamIsLive = localStorage.getItem("streamIsLive");
                const isLive = localStorage.getItem("isLive");

                const live = streamStatus === "online" || streamIsLive === "true" || isLive === "true";

                if (statusDot) statusDot.className = live ? "dot live" : "dot offline";
                if (statusLabel) statusLabel.textContent = live ? "В ЭФИРЕ" : "ОФФЛАЙН";
                if (streamBadge) streamBadge.style.display = live ? "inline-flex" : "none";
            }

            // Работа с данными пользователя
            const editBtn = document.getElementById("editBtn");
            const saveBtn = document.getElementById("saveBtn");
            const cancelBtn = document.getElementById("cancelBtn");

            const kickField = document.getElementById("kickField");
            const epicField = document.getElementById("epicField");

            let originalKick = "";
            let originalEpic = "";

            function getSavedUserData() {
                const raw = localStorage.getItem("underdogg_user") || localStorage.getItem("underdogg_user_data");
                if (!raw) return null;
                try {
                    return JSON.parse(raw);
                } catch (e) {
                    return null;
                }
            }

            function isRegistered() {
                const user = getSavedUserData();
                const legacyReg = localStorage.getItem('underdogg_registered');
                return !!(user && (user.registered || user.tg || user.telegramId)) || legacyReg === 'true';
            }

            function loadUserData() {
                const user = getSavedUserData();

                if (!user) {
                    // Ждем заполнения без блокировок и циклических редиректов
                    return;
                }

                const tgField = document.getElementById("telegramField");

                if (tgField) {
                    tgField.value = user.tg || (user.username ? "@" + user.username : user.telegramId) || "";
                    tgField.readOnly = true;
                }

                if (kickField) {
                    kickField.value = user.kick || "";
                    kickField.readOnly = true;
                }

                if (epicField) {
                    epicField.value = user.epic || "";
                    epicField.readOnly = true;
                }
            }

            // Редактирование
            if (editBtn) {
                editBtn.addEventListener("click", () => {
                    if (kickField) {
                        originalKick = kickField.value;
                        kickField.readOnly = false;
                    }
                    if (epicField) {
                        originalEpic = epicField.value;
                        epicField.readOnly = false;
                    }

                    if (kickField) kickField.focus();

                    if (editBtn) editBtn.classList.add("hidden");
                    if (saveBtn) saveBtn.classList.remove("hidden");
                    if (cancelBtn) cancelBtn.classList.remove("hidden");
                });
            }

            // Отмена
            if (cancelBtn) {
                cancelBtn.addEventListener("click", () => {
                    if (kickField) {
                        kickField.value = originalKick;
                        kickField.readOnly = true;
                    }
                    if (epicField) {
                        epicField.value = originalEpic;
                        epicField.readOnly = true;
                    }

                    if (editBtn) editBtn.classList.remove("hidden");
                    if (saveBtn) saveBtn.classList.add("hidden");
                    if (cancelBtn) cancelBtn.classList.add("hidden");
                });
            }

            // Сохранение
            if (saveBtn) {
                saveBtn.addEventListener("click", () => {
                    const newKick = kickField ? kickField.value.trim() : "";
                    const newEpic = epicField ? epicField.value.trim() : "";

                    if (!newKick || !newEpic) {
                        alert("⚠️ Поля Kick и Epicstar не могут быть пустыми!");
                        return;
                    }

                    let user = getSavedUserData() || {};
                    user.kick = newKick;
                    user.epic = newEpic;

                    localStorage.setItem("underdogg_user", JSON.stringify(user));
                    localStorage.setItem("underdogg_user_data", JSON.stringify(user));

                    if (kickField) kickField.readOnly = true;
                    if (epicField) epicField.readOnly = true;

                    if (editBtn) editBtn.classList.remove("hidden");
                    if (saveBtn) saveBtn.classList.add("hidden");
                    if (cancelBtn) cancelBtn.classList.add("hidden");

                    alert("✅ Данные успешно обновлены!");
                });
            }

            updateStreamStatus();
            loadUserData();
        });
    </script>
    <script src="js/app.js"></script>
</body>
</html>
