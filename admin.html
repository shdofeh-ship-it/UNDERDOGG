<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNDERDOGG — ADMIN PANEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ==========================
           АДМИН-СТИЛИ
        ========================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050102;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image:
                radial-gradient(circle at 50% 20%, rgba(180, 10, 25, 0.25) 0%, rgba(10, 0, 3, 0.95) 75%),
                radial-gradient(circle at 50% 80%, rgba(140, 5, 15, 0.2) 0%, rgba(5, 1, 2, 1) 70%);
        }

        .admin-container {
            width: 100%;
            max-width: 480px;
            background: radial-gradient(circle at 50% 30%, #1c0205 0%, #0d0103 65%, #050001 100%);
            border: 2px solid #ff2a4b;
            border-radius: 28px;
            padding: 30px 24px;
            box-shadow: 0 0 60px rgba(255, 0, 35, 0.3);
            animation: breatheBg 6s ease-in-out infinite;
        }

        @keyframes breatheBg {
            0%, 100% {
                background: radial-gradient(circle at 50% 30%, #1c0205 0%, #0d0103 65%, #050001 100%);
                box-shadow: 0 0 60px rgba(255, 0, 35, 0.3);
            }
            50% {
                background: radial-gradient(circle at 45% 35%, #2a0308 0%, #120205 65%, #080002 100%);
                box-shadow: 0 0 80px rgba(255, 0, 35, 0.45);
            }
        }

        .admin-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            color: #ff2a4b;
            text-shadow: 0 0 20px rgba(255, 42, 75, 0.4);
            letter-spacing: 4px;
            margin-bottom: 6px;
        }

        .admin-subtitle {
            text-align: center;
            color: #666;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 42, 75, 0.1);
            padding-bottom: 16px;
        }

        /* ===== ВХОД ===== */
        #loginSection {
            text-align: center;
            padding: 20px 0;
        }

        #loginSection input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 42, 75, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            margin-bottom: 14px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        #loginSection input:focus {
            border-color: #ff2a4b;
            box-shadow: 0 0 20px rgba(255, 42, 75, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #ff2a4b;
            border: none;
            border-radius: 30px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 42, 75, 0.3);
            transition: 0.3s;
        }

        .login-btn:hover {
            box-shadow: 0 0 50px rgba(255, 42, 75, 0.5);
            transform: scale(1.02);
        }

        .login-error {
            color: #ff4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* ===== АДМИН-ПАНЕЛЬ (скрыта до входа) ===== */
        #adminPanel {
            display: none;
        }

        .settings-group {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 42, 75, 0.1);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 18px;
        }

        .settings-group h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: #ff2a4b;
            letter-spacing: 2px;
            margin-bottom: 14px;
            text-shadow: 0 0 10px rgba(255, 42, 75, 0.2);
        }

        .setting-row {
            margin-bottom: 12px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-row label {
            display: block;
            color: #aaa;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .setting-row input,
        .setting-row select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 42, 75, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            font-family: 'Rajdhani', sans-serif;
        }

        .setting-row input:focus,
        .setting-row select:focus {
            border-color: #ff2a4b;
            box-shadow: 0 0 15px rgba(255, 42, 75, 0.15);
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: #00aa55;
            border: none;
            border-radius: 30px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 170, 85, 0.2);
            transition: 0.3s;
            margin-top: 4px;
        }

        .save-btn:hover {
            box-shadow: 0 0 40px rgba(0, 170, 85, 0.4);
            transform: scale(1.02);
        }

        /* ===== УЧАСТНИКИ ===== */
        .participants-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .participant-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 13px;
            border-left: 2px solid rgba(255, 42, 75, 0.2);
        }

        .participant-item .tg {
            color: #00ccff;
        }
        .participant-item .kick {
            color: #66ff66;
        }
        .participant-item .casino {
            color: #ffcc00;
        }

        .participant-item .remove-btn {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 16px;
            padding: 0 6px;
        }

        .participant-item .remove-btn:hover {
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }

        /* ===== СТАТИСТИКА ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 42, 75, 0.1);
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
        }

        .stat-box .num {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
        }

        .stat-box .label {
            font-size: 9px;
            color: #888;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .stat-box.total .num { color: #fff; }
        .stat-box.bots .num { color: #ff6666; }
        .stat-box.real .num { color: #00ff88; }
        .stat-box.winners .num { color: #ffcc00; }

        /* ===== КНОПКИ УПРАВЛЕНИЯ ===== */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }

        .action-btn {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .action-btn.primary {
            background: #ff2a4b;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 42, 75, 0.3);
        }

        .action-btn.primary:hover {
            box-shadow: 0 0 40px rgba(255, 42, 75, 0.5);
            transform: scale(1.02);
        }

        .action-btn.danger {
            background: transparent;
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .action-btn.danger:hover {
            background: #ff4444;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }

        .action-btn.success {
            background: #00aa55;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 170, 85, 0.2);
        }

        .action-btn.success:hover {
            box-shadow: 0 0 40px rgba(0, 170, 85, 0.4);
            transform: scale(1.02);
        }

        .action-btn.full {
            grid-column: 1 / -1;
        }

        /* ===== ВЫХОД ===== */
        .logout-btn {
            margin-top: 16px;
            padding: 10px;
            background: transparent;
            border: 1px solid #444;
            border-radius: 30px;
            color: #666;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        .logout-btn:hover {
            border-color: #ff2a4b;
            color: #ff2a4b;
        }

        /* СКРОЛЛ */
        .participants-list::-webkit-scrollbar {
            width: 4px;
        }
        .participants-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }
        .participants-list::-webkit-scrollbar-thumb {
            background: #ff2a4b;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="admin-container">

    <div class="admin-title">⛓️ UNDERDOGG</div>
    <div class="admin-subtitle">ADMIN PANEL v1.0</div>

    <!-- ============================================================ -->
    <!-- ===== ЭКРАН ВХОДА ===== -->
    <!-- ============================================================ -->
    <div id="loginSection">
        <input type="password" id="adminPassword" placeholder="ВВЕДИ ПАРОЛЬ" />
        <button class="login-btn" id="loginBtn">🔓 ВОЙТИ</button>
        <div class="login-error" id="loginError">❌ НЕВЕРНЫЙ ПАРОЛЬ</div>
    </div>

    <!-- ============================================================ -->
    <!-- ===== АДМИН-ПАНЕЛЬ (после входа) ===== -->
    <!-- ============================================================ -->
    <div id="adminPanel">

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="settings-group">
            <h3>📊 СТАТИСТИКА</h3>
            <div class="stats-grid">
                <div class="stat-box total">
                    <div class="num" id="statTotal">0</div>
                    <div class="label">ВСЕГО</div>
                </div>
                <div class="stat-box bots">
                    <div class="num" id="statBots">0</div>
                    <div class="label">БОТЫ</div>
                </div>
                <div class="stat-box real">
                    <div class="num" id="statReal">0</div>
                    <div class="label">РЕАЛЬНЫЕ</div>
                </div>
            </div>
            <div style="text-align:center;font-size:11px;color:#666;letter-spacing:1px;">
                🏆 ПОБЕДИТЕЛЕЙ: <span id="statWinners" style="color:#ffcc00;font-weight:700;">0</span>
            </div>
        </div>

        <!-- ===== УЧАСТНИКИ ===== -->
        <div class="settings-group">
            <h3>👥 УЧАСТНИКИ</h3>
            <div class="participants-list" id="participantsList">
                <div style="color:#444;font-size:13px;text-align:center;padding:20px 0;">
                    Нет зарегистрированных участников
                </div>
            </div>
            <div style="display:flex;gap:10px;margin-top:10px;">
                <button class="action-btn danger" style="flex:1;" id="clearParticipantsBtn">🗑️ ОЧИСТИТЬ</button>
                <button class="action-btn success" style="flex:1;" id="addDemoParticipantsBtn">➕ ДЕМО</button>
            </div>
        </div>

        <!-- ===== НАСТРОЙКИ ===== -->
        <div class="settings-group">
            <h3>⚙️ НАСТРОЙКИ</h3>

            <div class="setting-row">
                <label>📅 ДАТА РОЗЫГРЫША</label>
                <input type="datetime-local" id="giveawayDate" />
            </div>

            <div class="setting-row">
                <label>🔗 ССЫЛКА ПРИГЛАШЕНИЯ</label>
                <input type="text" id="inviteLinkInput" placeholder="https://t.me/bot?start=ref" />
            </div>

            <div class="setting-row">
                <label>🎥 ССЫЛКА НА СТРИМ</label>
                <input type="text" id="streamLinkInput" placeholder="https://kick.com/канал" />
            </div>

            <div class="setting-row">
                <label>🎰 НАЗВАНИЕ КАЗИНО</label>
                <input type="text" id="casinoNameInput" placeholder="Stake / Roobet / и т.д." />
            </div>

            <div class="setting-row">
                <label>🤖 ПРОЦЕНТ БОТОВ (0–100)</label>
                <input type="number" id="botPercentInput" min="0" max="100" value="40" />
            </div>

            <div class="setting-row">
                <label>🏆 КОЛИЧЕСТВО ПОБЕДИТЕЛЕЙ</label>
                <input type="number" id="winnersCountInput" min="1" max="10" value="3" />
            </div>

            <button class="save-btn" id="saveSettingsBtn">💾 СОХРАНИТЬ НАСТРОЙКИ</button>
        </div>

        <!-- ===== УПРАВЛЕНИЕ ===== -->
        <div class="settings-group">
            <h3>🎮 УПРАВЛЕНИЕ</h3>
            <div class="action-buttons">
                <button class="action-btn primary" id="runGiveawayBtn">🎰 ЗАПУСТИТЬ РОЗЫГРЫШ</button>
                <button class="action-btn success" id="pickWinnerBtn">🏆 ВЫБРАТЬ ПОБЕДИТЕЛЯ</button>
                <button class="action-btn danger full" id="resetAllBtn">🔄 СБРОСИТЬ ВСЁ</button>
            </div>
        </div>

        <!-- ===== ВЫХОД ===== -->
        <button class="logout-btn" id="logoutBtn">🚪 ВЫЙТИ</button>

    </div>

</div>

<!-- ============================================================ -->
<!-- ===== СКРИПТЫ АДМИНКИ ===== -->
<!-- ============================================================ -->
<script>
    document.addEventListener('DOMContentLoaded', function() {

        // ============================================================
        // 1. ПЕРЕМЕННЫЕ
        // ============================================================
        // 👇 СМЕНИ ПАРОЛЬ ЗДЕСЬ!
        const PASSWORD = 'underd0gg2026';

        const loginSection = document.getElementById('loginSection');
        const adminPanel = document.getElementById('adminPanel');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');

        const participantsList = document.getElementById('participantsList');
        const clearParticipantsBtn = document.getElementById('clearParticipantsBtn');
        const addDemoBtn = document.getElementById('addDemoParticipantsBtn');

        const giveawayDateInput = document.getElementById('giveawayDate');
        const inviteLinkInput = document.getElementById('inviteLinkInput');
        const streamLinkInput = document.getElementById('streamLinkInput');
        const casinoNameInput = document.getElementById('casinoNameInput');
        const botPercentInput = document.getElementById('botPercentInput');
        const winnersCountInput = document.getElementById('winnersCountInput');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');

        const runGiveawayBtn = document.getElementById('runGiveawayBtn');
        const pickWinnerBtn = document.getElementById('pickWinnerBtn');
        const resetAllBtn = document.getElementById('resetAllBtn');

        const statTotal = document.getElementById('statTotal');
        const statBots = document.getElementById('statBots');
        const statReal = document.getElementById('statReal');
        const statWinners = document.getElementById('statWinners');

        // ============================================================
        // 2. РАБОТА С LOCALSTORAGE
        // ============================================================
        function loadData() {
            const data = JSON.parse(localStorage.getItem('underdogg_admin') || '{}');
            return {
                participants: data.participants || [],
                settings: data.settings || {},
                winners: data.winners || [],
                giveawayActive: data.giveawayActive || false
            };
        }

        function saveData(data) {
            localStorage.setItem('underdogg_admin', JSON.stringify(data));
        }

        function getParticipants() {
            return loadData().participants;
        }

        function setParticipants(list) {
            const data = loadData();
            data.participants = list;
            saveData(data);
        }

        function getSettings() {
            return loadData().settings;
        }

        function setSettings(settings) {
            const data = loadData();
            data.settings = settings;
            saveData(data);
        }

        // ============================================================
        // 3. ВХОД / ВЫХОД
        // ============================================================
        loginBtn.addEventListener('click', function() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === PASSWORD) {
                loginSection.style.display = 'none';
                adminPanel.style.display = 'block';
                loginError.style.display = 'none';
                renderParticipants();
                loadSettingsToForm();
                updateStats();
            } else {
                loginError.style.display = 'block';
                setTimeout(() => { loginError.style.display = 'none'; }, 3000);
            }
        });

        logoutBtn.addEventListener('click', function() {
            adminPanel.style.display = 'none';
            loginSection.style.display = 'block';
            document.getElementById('adminPassword').value = '';
        });

        // ============================================================
        // 4. ОТОБРАЖЕНИЕ УЧАСТНИКОВ
        // ============================================================
        function renderParticipants() {
            const list = getParticipants();
            if (list.length === 0) {
                participantsList.innerHTML = `
                    <div style="color:#444;font-size:13px;text-align:center;padding:20px 0;">
                        Нет зарегистрированных участников
                    </div>
                `;
                return;
            }

            let html = '';
            list.forEach((p, index) => {
                html += `
                    <div class="participant-item">
                        <div>
                            <span class="tg">${p.tg || '—'}</span>
                            <span style="color:#444;margin:0 4px;">|</span>
                            <span class="kick">${p.kick || '—'}</span>
                            <span style="color:#444;margin:0 4px;">|</span>
                            <span class="casino">${p.casino || '—'}</span>
                        </div>
                        <button class="remove-btn" data-index="${index}">✕</button>
                    </div>
                `;
            });
            participantsList.innerHTML = html;

            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    const list = getParticipants();
                    list.splice(idx, 1);
                    setParticipants(list);
                    renderParticipants();
                    updateStats();
                });
            });
        }

        // ============================================================
        // 5. СТАТИСТИКА
        // ============================================================
        function updateStats() {
            const list = getParticipants();
            const total = list.length;
            const settings = getSettings();
            const botPercent = parseInt(settings.botPercent) || 40;
            const bots = Math.floor(total * (botPercent / 100));
            const real = total - bots;
            const winners = parseInt(settings.winnersCount) || 3;

            statTotal.textContent = total;
            statBots.textContent = bots;
            statReal.textContent = real;
            statWinners.textContent = Math.min(winners, real);
        }

        // ============================================================
        // 6. ЗАГРУЗКА НАСТРОЕК В ФОРМУ
        // ============================================================
        function loadSettingsToForm() {
            const settings = getSettings();
            if (settings.giveawayDate) {
                const date = new Date(settings.giveawayDate);
                if (!isNaN(date)) {
                    giveawayDateInput.value = date.toISOString().slice(0, 16);
                }
            }
            inviteLinkInput.value = settings.inviteLink || '';
            streamLinkInput.value = settings.streamLink || '';
            casinoNameInput.value = settings.casinoName || 'КАЗИНО';
            botPercentInput.value = settings.botPercent || 40;
            winnersCountInput.value = settings.winnersCount || 3;
        }

        // ============================================================
        // 7. СОХРАНЕНИЕ НАСТРОЕК
        // ============================================================
        saveSettingsBtn.addEventListener('click', function() {
            const settings = {
                giveawayDate: giveawayDateInput.value ? new Date(giveawayDateInput.value).toISOString() : '',
                inviteLink: inviteLinkInput.value.trim(),
                streamLink: streamLinkInput.value.trim(),
                casinoName: casinoNameInput.value.trim() || 'КАЗИНО',
                botPercent: parseInt(botPercentInput.value) || 40,
                winnersCount: parseInt(winnersCountInput.value) || 3
            };
            setSettings(settings);
            updateStats();
            const btn = this;
            const orig = btn.textContent;
            btn.textContent = '✅ СОХРАНЕНО!';
            btn.style.background = '#00aa55';
            setTimeout(() => {
                btn.textContent = orig;
                btn.style.background = '#00aa55';
            }, 2000);

            // Синхронизируем с home.html
            syncSettingsToHome();
        });

        // ============================================================
        // 8. СИНХРОНИЗАЦИЯ С HOME.HTML
        // ============================================================
        function syncSettingsToHome() {
            const settings = getSettings();
            if (settings.giveawayDate) {
                localStorage.setItem('giveawayDate', settings.giveawayDate);
            }
            if (settings.inviteLink) {
                localStorage.setItem('inviteLink', settings.inviteLink);
            }
            if (settings.streamLink) {
                localStorage.setItem('streamLink', settings.streamLink);
            }
            if (settings.casinoName) {
                localStorage.setItem('casinoName', settings.casinoName);
            }
        }

        // ============================================================
        // 9. ДЕМО-УЧАСТНИКИ
        // ============================================================
        addDemoBtn.addEventListener('click', function() {
            const list = getParticipants();
            const names = ['alex', 'max', 'dimon', 'vlad', 'sanya', 'kostya', 'petya', 'misha', 'igor', 'ruslan'];
            for (let i = 0; i < 8; i++) {
                const name = names[Math.floor(Math.random() * names.length)] + (Math.floor(Math.random() * 100));
                list.push({
                    tg: '@' + name,
                    kick: '@' + name + '_kick',
                    casino: 'user' + (Math.floor(Math.random() * 9000) + 1000)
                });
            }
            setParticipants(list);
            renderParticipants();
            updateStats();
        });

        // ============================================================
        // 10. ОЧИСТИТЬ УЧАСТНИКОВ
        // ============================================================
        clearParticipantsBtn.addEventListener('click', function() {
            if (confirm('🗑️ Удалить всех участников?')) {
                setParticipants([]);
                renderParticipants();
                updateStats();
            }
        });

        // ============================================================
        // 11. СБРОСИТЬ ВСЁ
        // ============================================================
        resetAllBtn.addEventListener('click', function() {
            if (confirm('⚠️ Сбросить ВСЁ (участники, настройки, победители)?')) {
                localStorage.removeItem('underdogg_admin');
                renderParticipants();
                updateStats();
                loadSettingsToForm();
                document.getElementById('adminPassword').value = '';
            }
        });

        // ============================================================
        // 12. ЗАПУСТИТЬ РОЗЫГРЫШ (имитация)
        // ============================================================
        runGiveawayBtn.addEventListener('click', function() {
            const list = getParticipants();
            if (list.length === 0) {
                alert('❌ Нет участников! Добавь демо или зарегистрируй реальных.');
                return;
            }
            alert('🎰 Розыгрыш запущен! Нажми "ВЫБРАТЬ ПОБЕДИТЕЛЯ" для выбора.');
        });

        // ============================================================
        // 13. ВЫБРАТЬ ПОБЕДИТЕЛЯ
        // ============================================================
        pickWinnerBtn.addEventListener('click', function() {
            const list = getParticipants();
            if (list.length === 0) {
                alert('❌ Нет участников!');
                return;
            }

            const settings = getSettings();
            const winnersCount = parseInt(settings.winnersCount) || 3;
            const botPercent = parseInt(settings.botPercent) || 40;

            // Отсеиваем ботов
            const real = list.filter((_, i) => {
                return i % 100 > botPercent;
            });

            if (real.length === 0) {
                alert('❌ Все участники отсеяны как боты!');
                return;
            }

            const shuffled = [...real].sort(() => Math.random() - 0.5);
            const winners = shuffled.slice(0, Math.min(winnersCount, real.length));

            const data = loadData();
            data.winners = winners;
            saveData(data);

            let msg = '🏆 ПОБЕДИТЕЛИ:\n\n';
            winners.forEach((w, i) => {
                msg += `${i+1}. ${w.tg} (Kick: ${w.kick}, Casino: ${w.casino})\n`;
            });
            alert(msg);
            updateStats();
        });

        // ============================================================
        // 14. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        renderParticipants();
        updateStats();
        loadSettingsToForm();
        syncSettingsToHome();

        console.log('🔐 Админ-панель загружена.');
        console.log('📌 Пароль: underd0gg2026 (смени в коде!)');

    });
</script>
