<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNDERDOGG HUB</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #000000;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.25) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
            z-index: 1;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(20, 0, 0, 0.6);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff0000;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 12px #ff0000; }
            100% { opacity: 0.4; transform: scale(0.9); }
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
            z-index: 1;
            margin: auto 0;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.8), 0 0 30px rgba(255, 0, 0, 0.4);
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            font-size: 13px;
            color: #ff3333;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        .avatar-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.4) 0%, rgba(0,0,0,0) 70%);
            animation: glowPulse 3s infinite alternate;
        }

        @keyframes glowPulse {
            0% { transform: scale(0.95); opacity: 0.6; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        .hood {
            width: 180px;
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.6));
            z-index: 2;
        }

        .progress-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .progress-labels {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
            transition: width 0.1s linear;
        }

        .percentage {
            color: #ff0000;
            font-weight: 700;
        }

        .buttons-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .btn-primary {
            background: rgba(150, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ffffff;
            box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.3), 0 0 10px rgba(255, 0, 0, 0.2);
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-primary.ready {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-primary.ready:active {
            transform: scale(0.98);
            background: rgba(255, 0, 0, 0.4);
            box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.6), 0 0 20px rgba(255, 0, 0, 0.6);
        }

        .btn-secondary {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid #333333;
            color: #888888;
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-secondary.ready {
            opacity: 1;
            pointer-events: auto;
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-secondary.ready:active {
            transform: scale(0.98);
            background: rgba(40, 40, 40, 0.8);
            border-color: #ffffff;
        }

        .btn-support {
            background: rgba(30, 0, 50, 0.3);
            border: 1px solid #8a2be2;
            color: #e0b0ff;
            opacity: 0.5;
            pointer-events: none;
            box-shadow: inset 0 0 8px rgba(138, 43, 226, 0.2), 0 0 8px rgba(138, 43, 226, 0.2);
        }

        .btn-support.ready {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-support.ready:active {
            transform: scale(0.98);
            background: rgba(138, 43, 226, 0.4);
            box-shadow: inset 0 0 15px rgba(138, 43, 226, 0.6), 0 0 20px rgba(138, 43, 226, 0.6);
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #0d0d0d;
            border: 1px solid #ff0000;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 1px;
        }

        .modal-subtitle {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
        }

        .form-group input:disabled {
            background: rgba(255, 255, 255, 0.02);
            color: #666;
            border-color: #222;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }

        .warning-text {
            font-size: 11px;
            color: #ff9900;
            margin-top: 5px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .success-text {
            font-size: 12px;
            color: #00ff66;
            margin-top: 5px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="status-badge">
            <span class="dot"></span>
            <span>СТАТУС СТРИМА <strong style="color: #ff0000;">В СЕТИ</strong></span>
        </div>
    </div>

    <div class="main-content">
        <h1 class="title">UNDERDOGG</h1>
        <div class="subtitle">System Initialization</div>

        <div class="avatar-container">
            <div class="avatar-glow"></div>
            <img src="images/hood.png" alt="Underdogg Hood" class="hood">
        </div>

        <div class="progress-block">
            <div class="progress-labels">
                <span>INITIALIZING SYSTEM...</span>
                <span><span id="loadingPercent">0</span>%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="loadingFill"></div>
            </div>
        </div>

        <div class="buttons-container">
            <button class="btn btn-primary" id="enterBtn" disabled>Войти в систему</button>
            <button class="btn btn-secondary" id="openRegisterBtn" disabled>Зарегистрироваться</button>
            <button class="btn btn-support" id="supportBtn">Связаться с модератором</button>
        </div>
    </div>

    <!-- Модальное окно регистрации -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal-content">
            <button class="close-btn" id="closeRegisterBtn">&times;</button>
            <h2 class="modal-title">РЕГИСТРАЦИЯ</h2>
            <div class="modal-subtitle">Введи данные для привязки аккаунтов</div>

            <form id="registerForm">
                <div class="form-group">
                    <label>TELEGRAM (@username)</label>
                    <input type="text" id="regTg" placeholder="@username" required>
                </div>

                <div class="form-group">
                    <label>KICK NICKNAME</label>
                    <input type="text" id="regKick" placeholder="Ваш ник на Kick" required>
                </div>

                <div class="form-group">
                    <label>EPICSTAR NICKNAME</label>
                    <input type="text" id="regEpic" placeholder="Ваш ник на Epicstar" required>
                </div>

                <div class="warning-text" id="warningBlock">
                    ⚠️ Данные можно ввести только ОДИН раз. Внимательно проверьте их перед сохранением!
                </div>

                <div class="success-text" id="successBlock">
                    ✅ Ваши данные уже сохранены и привязаны к системе!
                </div>

                <button type="submit" class="btn btn-primary ready" id="registerBtn" style="margin-top: 10px;">Сохранить данные</button>
            </form>
        </div>
    </div>

    <!-- 1. ПОДКЛЮЧАЕМ ЛОГИКУ БАЗЫ ДАННЫХ ВЕРСИИ 2.0 (ДЛЯ СБРОСА КЭША) -->
    <script src="js/app.js?v=2.0"></script>

    <!-- 2. СКТИПТ ИНТЕРФЕЙСА И АНИМАЦИИ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fill = document.getElementById('loadingFill');
            const percent = document.getElementById('loadingPercent');

            const enterBtn = document.getElementById('enterBtn');
            const openRegisterBtn = document.getElementById('openRegisterBtn');
            const supportBtn = document.getElementById('supportBtn');
            const modal = document.getElementById('registerModal');
            const closeBtn = document.getElementById('closeRegisterBtn');

            let isReady = false;

            // 1. Анимация загрузки
            let progress = 0;
            const interval = setInterval(function() {
                progress += Math.floor(Math.random() * 5) + 2;
                if (progress > 100) progress = 100;
                
                if (fill) fill.style.width = progress + '%';
                if (percent) percent.textContent = progress;
                
                if (progress >= 100) {
                    clearInterval(interval);
                    isReady = true;

                    if (enterBtn) {
                        enterBtn.removeAttribute('disabled');
                        enterBtn.classList.add('ready');
                    }
                    if (openRegisterBtn) {
                        openRegisterBtn.removeAttribute('disabled');
                        openRegisterBtn.classList.add('ready');
                    }
                    if (supportBtn) {
                        supportBtn.classList.add('ready');
                    }
                }
            }, 50);

            // 2. Кнопка ВОЙТИ В СИСТЕМУ
            if (enterBtn) {
                enterBtn.addEventListener('click', async function() {
                    if (!isReady) return;

                    let isRegistered = localStorage.getItem('underdogg_registered') === 'true';

                    if (isRegistered) {
                        location.href = 'home.html';
                        return;
                    }

                    // Получаем юзера Telegram
                    let tgUser = null;
                    if (typeof getTelegramUser === 'function') {
                        tgUser = getTelegramUser();
                    } else if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                        const u = window.Telegram.WebApp.initDataUnsafe.user;
                        if (u && u.username) tgUser = '@' + u.username;
                    }

                    if (!tgUser) {
                        alert('⚠️ Telegram не передал ваш @username. Перезапустите бота в Telegram!');
                        return;
                    }

                    // Асинхронный поиск в БД Firebase
                    if (window.firebase) {
                        const cleanTg = tgUser.replace('@', '');
                        try {
                            const dbRef = firebase.database().ref('users/' + cleanTg);
                            const snapshot = await dbRef.once('value');
                            
                            if (snapshot.exists()) {
                                const userData = snapshot.val();
                                localStorage.setItem('underdogg_user_data', JSON.stringify(userData));
                                localStorage.setItem('underdogg_registered', 'true');
                                location.href = 'home.html';
                            } else {
                                alert('⚠️ Пользователь ' + tgUser + ' не найден в базе данных! Пройдите регистрацию.');
                            }
                        } catch (err) {
                            alert('⚠️ Ошибка подключения к базе: ' + err.message);
                        }
                    } else {
                        alert('⚠️ Ошибка: База данных Firebase не подключена.');
                    }
                });
            }

            // 3. Открытие и закрытие модалки
            if (openRegisterBtn) {
                openRegisterBtn.addEventListener('click', function() {
                    if (isReady) {
                        checkUserRegistration();
                        if (modal) modal.classList.add('active');
                    }
                });
            }

            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    if (modal) modal.classList.remove('active');
                });
            }

            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) modal.classList.remove('active');
                });
            }

            // 4. Заполнение полей при повторном открытии
            function checkUserRegistration() {
                const isRegistered = localStorage.getItem('underdogg_registered') === 'true';
                if (isRegistered) {
                    const savedData = JSON.parse(localStorage.getItem('underdogg_user_data') || '{}');
                    
                    const regTg = document.getElementById('regTg');
                    const regKick = document.getElementById('regKick');
                    const regEpic = document.getElementById('regEpic');
                    const regBtn = document.getElementById('registerBtn');
                    const warn = document.getElementById('warningBlock');
                    const succ = document.getElementById('successBlock');

                    if (regTg) { regTg.value = savedData.tg || ''; regTg.disabled = true; }
                    if (regKick) { regKick.value = savedData.kick || ''; regKick.disabled = true; }
                    if (regEpic) { regEpic.value = savedData.epic || ''; regEpic.disabled = true; }

                    if (regBtn) {
                        regBtn.disabled = true;
                        regBtn.textContent = 'УЖЕ СОХРАНЕНО';
                    }
                    if (warn) warn.style.display = 'none';
                    if (succ) succ.style.display = 'block';
                }
            }

            // 5. Кнопка поддержки
            if (supportBtn) {
                supportBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.open('https://t.me/underd0gg_support', '_blank');
                });
            }
        });
    </script>
</body>
</html>
