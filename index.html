<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNDERDOGG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="screen">
        <!-- СТАТУС СТРИМА -->
        <div class="status">
            <span class="dot"></span>
            СТАТУС СТРИМА: <b>В СЕТИ</b>
        </div>

        <!-- ЛОГОТИП (ТЕКСТ) -->
        <h1 class="logo">UNDERDOGG</h1>

        <!-- ПОДЗАГОЛОВОК -->
        <div class="tagline">SYSTEM INITIALIZATION</div>

        <!-- ИЗОБРАЖЕНИЕ КАПЮШОНА -->
        <div class="hood-wrapper">
            <img src="images/hood.png" class="hood" alt="UNDERDOGG">
        </div>

        <!-- ПРОГРЕСС-БАР -->
        <div class="loading">
            <div class="loading-text">INITIALIZING SYSTEM...</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <!-- КНОПКА ВХОДА -->
        <button class="enter-btn" onclick="location.href='home.html'">▶ ВОЙТИ В СИСТЕМУ</button>
    </div>

</body>
</html>
