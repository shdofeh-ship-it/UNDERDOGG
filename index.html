<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNDERDOGG</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

    <!-- ЦЕНТРИРУЮЩИЙ КОНТЕЙНЕР -->
    <div style="
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
    ">

        <section class="loader-screen" style="
            text-align: center;
            max-width: 420px;
            width: 100%;
        ">

            <div class="stream-status" style="
                font-size: 14px;
                color: #888;
                letter-spacing: 2px;
                margin-bottom: 20px;
            ">
                <span class="status-dot" style="
                    display: inline-block;
                    width: 12px;
                    height: 12px;
                    background: #ff0000;
                    border-radius: 50%;
                    animation: pulse 1.5s infinite;
                    margin-right: 10px;
                    vertical-align: middle;
                "></span>
                <span>СТАТУС СТРИМА</span>
                <b style="color: #ff4444;">В СЕТИ</b>
            </div>

            <div class="logo-box">
                <h1 class="main-logo" style="
                    font-size: 48px;
                    letter-spacing: 6px;
                    color: #fff;
                    text-shadow: 0 0 10px #ff0000, 0 0 30px rgba(255, 0, 0, 0.3);
                    margin: 10px 0 5px 0;
                ">UNDERDOGG</h1>
            </div>

            <div class="tagline" style="
                font-size: 14px;
                color: #ff4444;
                letter-spacing: 4px;
                margin: 0 0 15px 0;
            ">
                SYSTEM INITIALIZATION
            </div>

            <div class="hood-box" style="margin: 10px 0;">
                <img src="images/hood.png" class="hood-image" alt="UNDERDOGG" style="
                    width: 180px;
                    max-width: 100%;
                    filter: drop-shadow(0 0 30px rgba(255, 0, 0, 0.4));
                ">
            </div>

            <!-- ===== НОВЫЙ БЛОК ЗАГРУЗКИ (ЗАМЕНЁН) ===== -->
            <div class="loading-block" style="margin: 20px 0;">
                <p class="loading-text" style="
                    font-size: 12px;
                    color: #666;
                    letter-spacing: 3px;
                    margin-bottom: 8px;
                ">INITIALIZING SYSTEM...</p>

                <div class="loading-bar" style="
                    width: 100%;
                    height: 4px;
                    background: #1a1a1a;
                    border-radius: 4px;
                    overflow: hidden;
                    margin-bottom: 8px;
                ">
                    <div class="loading-fill" id="loadingFill" style="
                        width: 0%;
                        height: 100%;
                        background: #ff0000;
                        border-radius: 4px;
                        animation: load 3s ease-in-out infinite;
                    "></div>
                </div>

                <div class="loading-percent" style="
                    font-size: 14px;
                    color: #ff4444;
                    letter-spacing: 2px;
                ">
                    <span id="loadingPercent">0</span>%
                </div>
            </div>
            <!-- ========================================= -->

            <button class="enter-btn" onclick="location.href='home.html'" style="
                margin-top: 20px;
                padding: 16px 48px;
                background: transparent;
                border: 2px solid #ff0000;
                color: #fff;
                font-family: 'Orbitron', sans-serif;
                font-size: 16px;
                cursor: pointer;
                border-radius: 8px;
                letter-spacing: 2px;
                transition: 0.3s;
            ">
                ▶ ВОЙТИ В СИСТЕМУ
            </button>

        </section>

    </div>

    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.7); }
        }
        @keyframes load {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>

    <script src="js/app.js"></script>
</body>
</html>
