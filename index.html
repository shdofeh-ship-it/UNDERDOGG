<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UNDERDOGG</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<section class="loader-screen">

    <div class="stream-status">
        <span class="status-dot"></span>
        <span>СТАТУС СТРИМА</span>
        <b>В СЕТИ</b>
    </div>

    <div class="logo-box">
        <h1 class="main-logo">
            UNDERDOGG
        </h1>
    </div>

    <div class="tagline">
        SYSTEM INITIALIZATION
    </div>

    <div class="hood-box">
        <img src="images/hood.png" class="hood-image">
    </div>

    <div class="loading">
        <div class="loading-text">
            INITIALIZING SYSTEM...
        </div>
        <div class="progress">
            <div class="progress-line"></div>
        </div>
    </div>

    <button class="enter-btn">
        ▶ ВОЙТИ В СИСТЕМУ
    </button>

</section>

<script src="js/app.js"></script>
</body>
</html>
