<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UNDERDOGG — ВХОД</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050102;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            background-image:
                radial-gradient(circle at 50% 20%, rgba(180, 10, 25, 0.25) 0%, rgba(10, 0, 3, 0.95) 75%),
                radial-gradient(circle at 50% 80%, rgba(140, 5, 15, 0.2) 0%, rgba(5, 1, 2, 1) 70%);
        }

        .screen {
            width: 100%;
            max-width: 420px;
            background: radial-gradient(circle at 50% 30%, #1c0205 0%, #0d0103 65%, #050001 100%);
            border: 1px solid rgba(255, 30, 60, 0.3);
            border-radius: 28px;
            padding: 28px 20px;
            box-shadow: 0 0 40px rgba(255, 0, 35, 0.2);
            text-align: center;
        }

        /* ===== СТАТУС-БАР ===== */
        .status-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border: 1px solid #ff2020;
            border-radius: 30px;
            background: rgba(255, 0, 0, 0.04);
            margin-bottom: 18px;
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            letter-spacing: 2px;
            color: #aaa;
        }
        .pulse {
            width: 10px;
            height: 10px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff0000;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.7); }
        }
        .status-right {
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* ===== ЛОГОТИП ===== */
        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 3px #fff, 0 0 10px #ff2a2a, 0 0 22px #ff0000, 0 0 40px rgba(255, 0, 0, 0.55);
            animation: glitch 6s infinite;
            margin-bottom: 2px;
        }
        @keyframes glitch {
            0%, 95%, 100% { transform: none; }
            96% { transform: translateX(-2px); }
            97% { transform: translateX(2px); }
            98% { transform: translateX(-1px); }
        }

        .brand-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: #ff4444;
            letter-spacing: 6px;
            margin-bottom: 12px;
            animation: glitchControl 4s infinite;
        }
        @keyframes glitchControl {
            0%, 90%, 100% { transform: none; opacity: 1; }
            92% { transform: translateX(-1px) skewX(-2deg); opacity: 0.8; color: #ff8888; }
            94% { transform: translateX(1px) skewX(2deg); opacity: 1; color: #ff4444; }
            96% { transform: translateX(-1px) skewX(-1deg); opacity: 0.9; color: #ff6666; }
            98% { transform: translateX(1px) skewX(1deg); opacity: 1; color: #ff4444; }
        }

        /* ===== ИЗОБРАЖЕНИЕ ===== */
        .hood {
            width: 55%;
            max-width: 180px;
            margin: 0 auto 10px;
            display: block;
            filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.3));
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* ===== ЗАГРУЗКА ===== */
        .loading-block {
            margin: 10px 0 14px 0;
        }
        .loading-text {
            color: #888;
            letter-spacing: 4px;
            font-size: 11px;
            margin-bottom: 6px;
        }
        .loading-bar {
            width: 100%;
            height: 4px;
            background: #161616;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 0, 0, 0.2);
        }
        .loading-fill {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            background: #ff0000;
        }
        .loading-percent {
            margin-top: 6px;
            color: #ff3b3b;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        /* ===== КНОПКИ ===== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 2px solid #ff0000;
            border-radius: 30px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
            opacity: 0.6;
            transform: scale(0.95);
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-main.ready {
            opacity: 1;
            transform: scale(1);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }
        .btn-main:hover {
            background: #ff0000;
            color: #000;
        }

        .btn-support {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 2px solid rgba(136, 68, 255, 0.3);
            border-radius: 30px;
            color: #8844ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
            opacity: 0.6;
            transform: scale(0.95);
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-support.ready {
            opacity: 1;
            transform: scale(1);
        }
        .btn-support:hover {
            border-color: #8844ff;
            background: rgba(136, 68, 255, 0.1);
        }

        /* ===== ФУТЕР ===== */
        .tagline-glitch {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 3px #fff, 0 0 10px #ff2a2a, 0 0 22px #ff0000, 0 0 40px rgba(255, 0, 0, 0.55);
            animation: glitchFooter 3s infinite;
            line-height: 1.4;
            margin-top: 14px;
            border-top: 1px solid rgba(255, 42, 75, 0.1);
            padding-top: 14px;
        }
        @keyframes glitchFooter {
            0%, 90%, 100% { transform: none; opacity: 1; }
            92% { transform: translateX(-2px) skewX(-2deg); opacity: 0.7; color: #ff6666; }
            94% { transform: translateX(2px) skewX(2deg); opacity: 1; color: #ffffff; }
            96% { transform: translateX(-1px) skewX(-1deg); opacity: 0.8; color: #ff3333; }
            98% { transform: translateX(1px) skewX(1deg); opacity: 1; color: #ffffff; }
        }

        /* ============================================================ */
        /* ===== МОДАЛКА РЕГИСТРАЦИИ (лёгкая) ===== */
        /* ============================================================ */
        #registerModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        #registerModal.active {
            display: flex;
        }

        .modal-content {
            background: radial-gradient(circle at 50% 30%, #1c0205, #0d0103);
            border: 2px solid #ff2a4b;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            padding: 26px 20px;
            box-shadow: 0 0 40px rgba(255, 0, 35, 0.3);
            max-height: 95vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 20px #ff2a4b;
            margin-bottom: 14px;
            text-align: center;
        }

        .modal-content .field {
            margin-bottom: 10px;
            text-align: left;
        }
        .modal-content .field label {
            display: block;
            color: #aaa;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .modal-content .field input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 42, 75, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            font-family: 'Rajdhani', sans-serif;
        }
        .modal-content .field input:focus {
            border-color: #ff2a4b;
            box-shadow: 0 0 15px rgba(255, 42, 75, 0.15);
        }
        .modal-content .field input:disabled {
            opacity: 0.4;
            border-color: rgba(255, 42, 75, 0.1);
        }

        .modal-content .warning-text {
            font-size: 10px;
            color: #ff8800;
            letter-spacing: 1px;
            margin: 6px 0 12px 0;
            padding: 6px 10px;
            border: 1px solid rgba(255, 136, 0, 0.15);
            border-radius: 8px;
            background: rgba(255, 136, 0, 0.04);
            text-align: center;
            animation: blinkWarning 2s infinite;
        }
        @keyframes blinkWarning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .modal-content .success-text {
            display: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
            padding: 14px 0;
            margin: 8px 0;
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 12px;
            background: rgba(0, 255, 136, 0.04);
            text-align: center;
        }

        .modal-content .btn-modal {
            width: 100%;
            padding: 14px;
            background: #ff2a4b;
            border: none;
            border-radius: 30px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(255, 42, 75, 0.3);
            margin-top: 4px;
        }
        .modal-content .btn-modal:hover {
            box-shadow: 0 0 35px rgba(255, 42, 75, 0.5);
            transform: scale(1.02);
        }
        .modal-content .btn-modal:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .modal-content .btn-close {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #444;
            border-radius: 30px;
            color: #888;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .modal-content .btn-close:hover {
            border-color: #ff2a4b;
            color: #ff2a4b;
        }
    </style>
</head>
<body>

<div class="screen">

    <!-- ===== СТАТУС-БАР ===== -->
    <div class="status-card">
        <div class="status-left">
            <span class="pulse" id="indexStatusDot"></span>
            <span>СТАТУС СТРИМА</span>
        </div>
        <div class="status-right" id="indexStatusLabel">
            НЕ В ЭФИРЕ
        </div>
    </div>

    <!-- ===== ЛОГОТИП ===== -->
    <div class="brand-title">UNDERDOGG</div>
    <div class="brand-subtitle">SYSTEM INITIALIZATION</div>

    <!-- ===== ИЗОБРАЖЕНИЕ ===== -->
    <img class="hood" src="images/hood.png" alt="UNDERDOGG" />

    <!-- ===== ЗАГРУЗКА ===== -->
    <div class="loading-block">
        <div class="loading-text">INITIALIZING SYSTEM...</div>
        <div class="loading-bar">
            <div class="loading-fill" id="loadingFill"></div>
        </div>
        <div class="loading-percent">
            <span id="loadingPercent">0</span>%
        </div>
    </div>

    <!-- ===== КНОПКИ ===== -->
    <div class="btn-group">
        <button class="btn-main" id="openRegisterBtn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        <button class="btn-main" id="enterBtn" onclick="location.href='home.html'">ВОЙТИ В СИСТЕМУ</button>
        <a href="#" class="btn-support" id="supportBtn">СВЯЗАТЬСЯ С МОДЕРАТОРОМ</a>
    </div>

    <!-- ===== ФУТЕР ===== -->
    <div class="tagline-glitch">
        NO FACE.<br>NO LIMITS.
    </div>

</div>

<!-- ============================================================ -->
<!-- ===== МОДАЛКА РЕГИСТРАЦИИ ===== -->
<!-- ============================================================ -->
<div id="registerModal">
    <div class="modal-content">
        <h2>РЕГИСТРАЦИЯ</h2>

        <div class="field">
            <label>TELEGRAM (для связи)</label>
            <input type="text" id="regTg" placeholder="@username" />
        </div>
        <div class="field">
            <label>KICK</label>
            <input type="text" id="regKick" placeholder="ник без @" />
        </div>
        <div class="field">
            <label>EPICSTAR</label>
            <input type="text" id="regEpic" placeholder="ник в Epicstar" />
        </div>

        <div class="warning-text">
            ВНИМАНИЕ! Данные вносятся ОДИН РАЗ. После сохранения изменить их будет НЕВОЗМОЖНО.
        </div>

        <div class="success-text" id="successMessage">
            РЕГИСТРАЦИЯ УСПЕШНА!<br>
            <span style="font-size: 12px; color: #888; letter-spacing: 1px;">Данные сохранены. Изменение невозможно.</span>
        </div>

        <button class="btn-modal" id="registerBtn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        <button class="btn-close" id="closeRegisterBtn">ЗАКРЫТЬ</button>
    </div>
</div>

<!-- ============================================================ -->
<!-- ===== СКРИПТЫ (лёгкие) ===== -->
<!-- ============================================================ -->
<script>
    document.addEventListener('DOMContentLoaded', function() {

        // ============================================================
        // 1. ПРОГРЕСС-БАР
        // ============================================================
        const fill = document.getElementById('loadingFill');
        const percent = document.getElementById('loadingPercent');
        const enterBtn = document.getElementById('enterBtn');
        const openRegisterBtn = document.getElementById('openRegisterBtn');
        const supportBtn = document.getElementById('supportBtn');

        let progress = 0;
        const interval = setInterval(function() {
            progress += Math.floor(Math.random() * 4) + 1;
            if (progress > 100) progress = 100;
            fill.style.width = progress + '%';
            percent.textContent = progress;
            if (progress >= 100) {
                clearInterval(interval);
                enterBtn.classList.add('ready');
                openRegisterBtn.classList.add('ready');
                supportBtn.classList.add('ready');
            }
        }, 80);

        // ============================================================
        // 2. СТАТУС СТРИМА
        // ============================================================
        function updateIndexStatus() {
            const isLive = localStorage.getItem('streamIsLive') === 'true';
            const dot = document.getElementById('indexStatusDot');
            const label = document.getElementById('indexStatusLabel');

            if (dot) {
                dot.style.background = isLive ? '#ff0000' : '#444';
                dot.style.boxShadow = isLive ? '0 0 15px #ff0000' : '0 0 5px #444';
                dot.style.animation = isLive ? 'pulse 1.5s infinite' : 'none';
            }
            if (label) {
                label.textContent = isLive ? 'В ЭФИРЕ' : 'НЕ В ЭФИРЕ';
                label.style.color = isLive ? '#ff4040' : '#888';
            }
        }

        updateIndexStatus();
        setInterval(updateIndexStatus, 5000);

        // ============================================================
        // 3. МОДАЛКА
        // ============================================================
        const modal = document.getElementById('registerModal');
        const closeBtn = document.getElementById('closeRegisterBtn');
        const registerBtn = document.getElementById('registerBtn');
        const tgInput = document.getElementById('regTg');
        const kickInput = document.getElementById('regKick');
        const epicInput = document.getElementById('regEpic');
        const successMessage = document.getElementById('successMessage');

        openRegisterBtn.addEventListener('click', function() {
            modal.classList.add('active');
        });

        closeBtn.addEventListener('click', function() {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        // ============================================================
        // 4. РЕГИСТРАЦИЯ
        // ============================================================
        function checkRegistration() {
            const registered = localStorage.getItem('underdogg_registered') === 'true';
            if (registered) {
                tgInput.disabled = true;
                kickInput.disabled = true;
                epicInput.disabled = true;
                registerBtn.textContent = 'УЖЕ ЗАРЕГИСТРИРОВАН';
                registerBtn.disabled = true;
                registerBtn.style.opacity = '0.4';
                successMessage.style.display = 'block';
            }
        }

        checkRegistration();

        registerBtn.addEventListener('click', function() {
            const tg = tgInput.value.trim();
            const kick = kickInput.value.trim();
            const epic = epicInput.value.trim();

            if (!tg || !kick || !epic) {
                alert('Заполни все поля!');
                return;
            }

            if (!tg.startsWith('@')) {
                alert('Telegram ник должен начинаться с @');
                return;
            }

            const userData = { tg, kick, epic, date: new Date().toISOString() };
            localStorage.setItem('underdogg_user_data', JSON.stringify(userData));
            localStorage.setItem('underdogg_registered', 'true');

            tgInput.disabled = true;
            kickInput.disabled = true;
            epicInput.disabled = true;
            registerBtn.textContent = 'ЗАРЕГИСТРИРОВАН';
            registerBtn.disabled = true;
            registerBtn.style.opacity = '0.4';
            successMessage.style.display = 'block';

            alert('Регистрация успешна! Данные сохранены. Изменить их нельзя.');
        });

        // ============================================================
        // 5. СВЯЗЬ С МОДЕРАТОРОМ
        // ============================================================
        document.getElementById('supportBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.open('https://t.me/underd0gg_support', '_blank');
        });

    });
</script>

</body>
</html>
