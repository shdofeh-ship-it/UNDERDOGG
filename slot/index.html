<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNDERDOGG - CYBER SLOTS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slot-container">
        <!-- Верхняя панель -->
        <header class="header">
            <div class="user-info">
                <div class="avatar-box">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100" alt="Avatar">
                </div>
                <div>
                    <div class="username">SHDOFEH SHIP IT</div>
                    <div class="status"><span class="status-dot"></span> STATUS: ONLINE</div>
                </div>
            </div>
            <div class="logo-area">
                <div class="crown-icon">👑</div>
                <h1>UNDERDOGG</h1>
                <div class="subtitle">CYBER SLOTS</div>
            </div>
            <div class="top-controls">
                <button class="icon-btn">⛶</button>
                <button class="icon-btn" id="sound-toggle">🔊</button>
                <button class="icon-btn">≡</button>
                <div class="clock">12:34</div>
            </div>
        </header>

        <div class="main-layout">
            <!-- Левая панель статистики -->
            <aside class="sidebar-left">
                <div class="stat-box">
                    <span class="stat-label">MULTIPLIER</span>
                    <span class="stat-value highlight-red">X5</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">FREE SPINS</span>
                    <span class="stat-value highlight-red">12</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">LEVEL 3</span>
                    <div class="progress-dots">
                        <span class="dot active"></span>
                        <span class="dot active"></span>
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
                <div class="stat-box balance-box">
                    <span class="stat-label">BALANCE</span>
                    <span class="stat-number">₱100,000.00</span>
                </div>
                <div class="stat-box win-box">
                    <span class="stat-label">WIN</span>
                    <span class="stat-number">₱2,450.00</span>
                </div>
            </aside>

            <!-- Игровое поле (Барабаны с графическими символами) -->
            <main class="slots-board">
                <div class="reels-grid" id="reelsGrid">
                    <!-- Барабан 1 -->
                    <div class="reel"><div class="reel-track" id="track-0">
                        <div class="symbol"><img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=200" alt="symbol"></div>
                        <div class="symbol"><img src="https://images.unsplash.com/photo-1563089145-599997674d42?w=200" alt="symbol"></div>
                        <div class="symbol"><img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=200" alt="symbol"></div>
                    </div></div>
                    <!-- Барабан 2 -->
                    <div class="reel"><div class="reel-track" id="track-1">
                        <div class="symbol"><img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=200" alt="symbol"></div>
                        <div class="symbol"><img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=200" alt="symbol"></div>
                        <div class="symbol"><img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=200" alt="symbol"></div>
                    </div></div>
                    <!-- Барабан 3 -->
                    <div class="reel active-reel"><div class="reel-track" id="track-2">
                        <div class="symbol wild-symbol">WILD</div>
                        <div class="symbol"><img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=200" alt="symbol"></div>
                        <div class="symbol"><img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=200" alt="symbol"></div>
                    </div></div>
                    <!-- Барабан 4 -->
                    <div class="reel"><div class="reel-track" id="track-3">
                        <div class="symbol"><img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=200" alt="symbol"></div>
                        <div class="symbol"><span class="card-num">10</span></div>
                        <div class="symbol"><span class="card-num">J</span></div>
                    </div></div>
                    <!-- Барабан 5 -->
                    <div class="reel"><div class="reel-track" id="track-4">
                        <div class="symbol"><img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=200" alt="symbol"></div>
                        <div class="symbol"><img src="https://images.unsplash.com/photo-1607799279861-4dd421887fb3?w=200" alt="symbol"></div>
                        <div class="symbol"><span class="card-num">K</span></div>
                    </div></div>
                </div>
            </main>
        </div>

        <!-- Нижняя панель управления -->
        <footer class="footer-panel">
            <button class="control-icon-btn">ℹ</button>
            <button class="control-icon-btn">⚙</button>
            
            <div class="bet-control">
                <span class="bet-label">BET</span>
                <span class="bet-val">₱100.00</span>
                <button class="bet-btn" id="bet-minus">-</button>
                <button class="bet-btn" id="bet-plus">+</button>
            </div>

            <button class="spin-btn" id="spinBtn">
                <div class="spin-text">SPIN</div>
                <div class="spin-sub">HOLD FOR AUTO</div>
            </button>

            <button class="action-panel-btn">MAX BET</button>
            <button class="action-panel-btn">AUTO PLAY <br>∞</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
